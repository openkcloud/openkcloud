# Check auto merge contiditons of PR and proceed merging
name: "Auto-merge in condition"

# Event on a comment (in PR)
on:
  issue_comment:
    types: [created]
jobs:
  # Check auto merge contiditons of PR and proceed merging
  automerge:
    # Apply this job if it is a PR and by OWNER with '/approve' comment
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve') }}

    # See https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is used only for adding the label; merging uses CR_PAT
    permissions:
      issues: write
      pull-requests: write
    steps:
      # Check the commenter is a member of the maintainer team of this repo
      - name: Extract Repository Name
        id: repo-name
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)" >> $GITHUB_ENV

      - name: Get Maintainer Team Members
        id: check-team-members
        run: |
          TEAM_NAME="${{ env.REPO_NAME }}-maintainer"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR} / TEAM_NAME: ${TEAM_NAME}"

          TEAM_MEMBERS=$(curl -L \
                          -H "Accept: application/vnd.github+json" \
                          -H "Authorization: Bearer ${{ secrets.CR_PAT }}" \
                          -H "X-GitHub-Api-Version: 2022-11-28" \
                          https://api.github.com/orgs/openKcloud/teams/${TEAM_NAME}/members | jq -r '.[] | .login' | tr '\n' ',')
          echo "TEAM_MEMBERS=$TEAM_MEMBERS" >> $GITHUB_ENV
          echo "TEAM_MEMBERS: ${TEAM_MEMBERS}"

      - name: Verify if GITHUB_ACTOR is a Maintainer Team Member
        run: |
          TEAM_MEMBERS_ARRAY=(${TEAM_MEMBERS//,/ })
          if [[ ! " ${TEAM_MEMBERS_ARRAY[@]} " =~ " ${GITHUB_ACTOR} " ]]; then
            echo "User ${GITHUB_ACTOR} is not a member of the team. Stopping workflow."
            exit 1
          fi

      # Apply 'approved' label when OWNER left '/approve' comment
      # (REST call, so the label is created if it does not exist yet)
      - name: Add 'approved' label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" -f "labels[]=approved" --silent

      # AutoMerging if this PR has MERGE_LABELS: approved (not wip, hold)
      # Merge commit title is the PR title; waits for mergeability with retries
      - name: automerge-lgtm-approved
        env:
          GH_TOKEN: ${{ secrets.CR_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REQUIRED_LABELS: "approved"
          BLOCKING_LABELS: "wip hold"
          MERGE_METHOD: "merge"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10"
        run: |
          set -euo pipefail
          for ((i = 0; i <= MERGE_RETRIES; i++)); do
            if ((i > 0)); then sleep "$MERGE_RETRY_SLEEP"; fi
            PR=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}") || continue
            STATE=$(jq -r '.state' <<<"$PR")
            MERGED=$(jq -r '.merged' <<<"$PR")
            DRAFT=$(jq -r '.draft' <<<"$PR")
            MERGEABLE_STATE=$(jq -r '.mergeable_state // "unknown"' <<<"$PR")
            has_label() { jq -e --arg l "$1" 'any(.labels[]; .name == $l)' <<<"$PR" >/dev/null; }

            if [[ "$MERGED" == "true" ]]; then echo "Already merged."; exit 0; fi
            if [[ "$STATE" != "open" ]]; then echo "PR state is ${STATE}, skipping."; exit 0; fi
            for l in $REQUIRED_LABELS; do
              has_label "$l" || { echo "Required label missing: $l, skipping."; exit 0; }
            done
            for l in $BLOCKING_LABELS; do
              ! has_label "$l" || { echo "Blocking label present: $l, skipping."; exit 0; }
            done

            echo "mergeable_state: ${MERGEABLE_STATE} (attempt $((i + 1)))"
            case "$MERGEABLE_STATE" in
              clean|has_hooks|unstable|unknown)
                TITLE=$(jq -r '.title' <<<"$PR")
                HEAD_SHA=$(jq -r '.head.sha' <<<"$PR")
                if OUT=$(gh api -X PUT "repos/${GH_REPO}/pulls/${PR_NUMBER}/merge" \
                     -f merge_method="$MERGE_METHOD" \
                     -f commit_title="$TITLE" \
                     -f commit_message="" \
                     -f sha="$HEAD_SHA" --silent 2>&1); then
                  echo "PR #${PR_NUMBER} merged."
                  exit 0
                fi
                echo "Merge failed: ${OUT}"
                # Errors that retrying cannot fix
                if grep -qiE 'reviews? (is|are) required|rate limit' <<<"$OUT"; then exit 1; fi
                ;;
              dirty)
                echo "PR has merge conflicts."; exit 1 ;;
            esac
            if [[ "$DRAFT" == "true" ]]; then echo "PR is a draft."; exit 1; fi
          done
          echo "PR #${PR_NUMBER} could not be merged after $((MERGE_RETRIES + 1)) attempts."
          exit 1
