---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodedevicereports.npu.ai
spec:
  group: npu.ai
  names:
    kind: NodeDeviceReport
    listKind: NodeDeviceReportList
    plural: nodedevicereports
    shortNames:
    - ndr
    singular: nodedevicereport
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              nodeName:
                description: 이 리포트가 속하는 노드 이름 (immutable 권장)
                type: string
            required:
            - nodeName
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              consumers:
                description: |-
                  Consumers 는 이 노드에서 장치를 쥔 컨테이너 목록이다(kubelet PodResources). nil 은 "모른다"
                  (수집 실패·미보고), 빈 목록은 "쥔 컨테이너가 없다" — 둘을 구분한다.
                items:
                  description: DeviceConsumer 는 kubelet PodResources API 가 낸, 장치 하나를
                    쥔 컨테이너 하나다. 추측하지 않는다.
                  properties:
                    container:
                      type: string
                    deviceID:
                      description: DeviceID 는 kubelet 이 낸 device_ids 원문이다(벤더 device-plugin
                        이 정한 문자열, PCI 가 아니다).
                      type: string
                    namespace:
                      type: string
                    pod:
                      type: string
                    resourceName:
                      type: string
                  required:
                  - container
                  - deviceID
                  - namespace
                  - pod
                  - resourceName
                  type: object
                type: array
              consumersError:
                description: ConsumersError 는 소켓을 읽지 못한 사유다. 채워져 있으면 Consumers 는 nil
                  이다.
                type: string
              consumersObservedAt:
                description: ConsumersObservedAt 은 Consumers 를 읽은 시각이다. Consumers
                  가 nil 이 아니면 채운다.
                format: date-time
                type: string
              devices:
                items:
                  properties:
                    computeCapability:
                      type: string
                    count:
                      format: int32
                      type: integer
                    driverBinding:
                      description: |-
                        DriverBinding 은 해당 장치의 PCI 커널 드라이버 바인딩 상태입니다.
                        "nvidia"=드라이버 바인딩, "vfio-pci"=passthrough 바인딩, "none"=미바인딩(free). passthrough 감지용.
                      type: string
                    driverLoaded:
                      type: boolean
                    driverVersion:
                      type: string
                    driverVersionDetail:
                      type: string
                    driverVersionOnDisk:
                      description: |-
                        DriverVersionOnDisk 는 설치된(디스크) 드라이버 버전 = 재부팅 후 로드될 버전입니다.
                        로드된 버전(DriverVersion, /proc)과 다르면 대역외 드리프트입니다. detector 가 nvidia
                        dpkg 에서 채우며, CRD 스키마에 있어야 apiserver 가 detector 방출을 pruning 하지 않습니다.
                      type: string
                    firmwareVersion:
                      type: string
                    memoryMiB:
                      description: GFD 소스 필드 — node-agent 가 스캔 시 sysfs/PCI 에서 best-effort
                        추출합니다(미가용 시 공란).
                      format: int64
                      type: integer
                    migCurrentGeometry:
                      description: MigCurrentGeometry 는 현 GI 요약("1g.6gb x4"). ""/"disabled"
                        = 없음. truthful Diff 진실 소스.
                      type: string
                    migLgipOutput:
                      description: |-
                        MigLgipOutput 은 `nvidia-smi mig -lgip` 원문입니다(MIG profile discovery 소스).
                        node-manager(detector) 가 채웁니다. NVIDIA 이외 벤더는 공란.
                      type: string
                    migModeCurrent:
                      description: |-
                        MigModeCurrent/Pending 은 NVIDIA MIG 모드 관측값이다(detector per-PCI, ).
                        Disabled 만 apply 안전. Unknown(조회/파싱 실패) 또는 Enabled 는 apply 차단.
                      type: string
                    migModePending:
                      type: string
                    migObservationError:
                      description: MigObservationError 는 관측 실패 사유(fail-closed 근거).
                        비어있지 않으면 apply 차단.
                      type: string
                    model:
                      type: string
                    needsReboot:
                      type: boolean
                    pcieAddress:
                      type: string
                    vendor:
                      type: string
                  type: object
                type: array
              observedAt:
                description: |-
                  ObservedAt 은 node-agent 가 이 보고서를 마지막으로 갱신한 시각입니다. 비어 있으면 "관측 시각
                  미상" 이고, health 판정은 그 상태를 Healthy 로 승격하지 않습니다(모르는 것을 아는 것처럼
                  다루지 않는다 — ).
                format: date-time
                type: string
              passthroughReserved:
                description: |-
                  PassthroughReserved 는 노드에 GPU 가 존재하며 전량 vfio-pci(passthrough)에 바인딩된 경우 true 입니다.
                  관리자가 passthrough 예약 노드를 식별하고 드라이버 설치 보류 판단을 보조합니다.
                type: boolean
              validation:
                description: Validation 은 node-agent 가 상시/정기 실행하는 벤더별 검증 결과입니다.
                properties:
                  lastRunTime:
                    description: LastRunTime 은 마지막 검증 시각입니다(node-agent 가 RFC3339 로
                      기록).
                    format: date-time
                    type: string
                  passed:
                    description: Passed 는 게이트 step 전부 통과 여부입니다(AC-1).
                    type: boolean
                  steps:
                    description: 'Steps 는 step 별 결과입니다(AC-3: 실패 step 식별).'
                    items:
                      description: ValidationStep 은 5단계 각각의 결과입니다.
                      properties:
                        message:
                          description: Message 는 실패/보조 사유입니다(운영자 디버깅).
                          type: string
                        name:
                          description: |-
                            Name 은 step 이름입니다("driverModule"|"deviceNode"|"devicePlugin"|"runtime"|"sampleWorkload").
                            멀티벤더 노드는 "<vendor>/<step>" 접두사가 붙습니다.
                          type: string
                        notApplicable:
                          description: |-
                            NotApplicable 은 Passed 와 별개 축입니다 — 통과도 실패도 아닌 "해당없음" 상태를 표시합니다
                            (예: control-plane 배제 노드). 이 이름·json 태그는 detector(node-device-detector/types.go 의
                            ValidationStep)와 정확히 같아야 합니다 — 다르면 구조적 스키마가 그 값을 조용히 잘라냅니다.
                          type: boolean
                        passed:
                          description: Passed 는 해당 step 통과 여부입니다.
                          type: boolean
                      required:
                      - name
                      - passed
                      type: object
                    type: array
                  vendor:
                    description: Vendor 는 검증 대상 벤더입니다(멀티벤더 노드는 콤마 구분).
                    type: string
                required:
                - passed
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
