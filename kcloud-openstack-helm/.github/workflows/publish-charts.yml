name: Publish Helm Charts to GHCR (OCI)

# kcloud-openstack-helm 의 전 chart를 패키징해 GHCR에 OCI 아티팩트로 발행한다.
# 목적: openstack-helm tarballs proxy(가변 upstream 캐시) 의존을 끊고,
#       우리가 통제하는 immutable chart 세트를 self-host 한다.
#
# 결과 경로: ghcr.io/openkcloud/kcloud-openstack-helm/<chart>:<version>
#   예) ghcr.io/openkcloud/kcloud-openstack-helm/cyborg:2024.2.0
#
# 배포측(install-openstack-on-k8s)에서:
#   OSH_HELM_REPO_URL = oci://ghcr.io/openkcloud
#   HELM_REPO_NAME    = kcloud-openstack-helm
#   → install-*.sh 가 oci://ghcr.io/openkcloud/kcloud-openstack-helm/<svc> 를 pull

on:
  push:
    branches: [ 2024.2.0-kcloud ]
  workflow_dispatch:

jobs:
  publish-charts:
    if: github.repository_owner == 'openkcloud'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    env:
      OCI_REPO: oci://ghcr.io/openkcloud/kcloud-openstack-helm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: Login to GHCR (helm registry)
        run: |
          echo "${{ secrets.CR_PAT_RWD }}" \
            | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Package and push charts
        run: |
          set -euo pipefail
          failed=""
          # This fork carries only the charts kcloud actually customises.
          # Currently that is cyborg (logging changes); every other service is
          # deployed from upstream openstack-helm via the proxy at its tested
          # version, so only cyborg is published here.
          CHARTS="cyborg"

          for chart in $CHARTS; do
            chart_yaml="$chart/Chart.yaml"
            if [ ! -f "$chart_yaml" ]; then
              echo "ERROR: chart not found: $chart_yaml" >&2
              failed="${failed} ${chart}"
              continue
            fi
            version="$(awk '/^version:/{print $2; exit}' "$chart_yaml")"
            echo "::group::${chart} (${version})"

            # 의존성(helm-toolkit)이 있으면 charts/ 에 번들 (repo 내 file://../helm-toolkit)
            if grep -q '^dependencies:' "$chart_yaml"; then
              helm dependency build "$chart"
            fi

            helm package "$chart" --destination /tmp/charts
            pkg="/tmp/charts/${chart}-${version}.tgz"

            if [ ! -f "$pkg" ]; then
              echo "ERROR: expected package not found: $pkg" >&2
              failed="${failed} ${chart}"
              echo "::endgroup::"
              continue
            fi

            helm push "$pkg" "${OCI_REPO}"
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "Charts failed to publish:${failed}" >&2
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "Published charts to ${OCI_REPO}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NOTE: newly created GHCR packages are private by default." >> "$GITHUB_STEP_SUMMARY"
          echo "Set each package to public once (Org > Packages > package > settings)," >> "$GITHUB_STEP_SUMMARY"
          echo "or the deploy nodes must 'helm registry login ghcr.io' before pulling." >> "$GITHUB_STEP_SUMMARY"

  # Prune old chart versions in GHCR so packages don't grow unbounded.
  # Keep the latest 3 versions per chart; only untagged (superseded) versions
  # are removed, so a currently-tagged release is never deleted. Mirrors the
  # image-retention approach in the service repos' docker-build workflows.
  cleanup-charts:
    needs: publish-charts
    if: github.repository_owner == 'openkcloud'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart:
          - cyborg
    steps:
      - name: Prune ${{ matrix.chart }} to the latest 3 versions
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: kcloud-openstack-helm/${{ matrix.chart }}
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: true
          token: ${{ secrets.CR_PAT_RWD }}
