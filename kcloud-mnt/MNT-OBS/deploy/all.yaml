# mnt-obs 배포 — ConfigMap + Deployment + Service (스캐폴드)
# 이미지: harbor.io:7443/mnt/mnt-obs:<TAG>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mnt-obs-config
  namespace: openkcloud-mnt
data:
  SERVICE_NAME: "mnt-obs"
  API_PREFIX: "/api/obs"
  CORS_ORIGINS: ""
  CORE_API_BASE: "http://mnt-core.openkcloud-mnt.svc.cluster.local"
  PROMETHEUS_URL: ""
  LOKI_URL: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnt-obs
  namespace: openkcloud-mnt
  labels: { app: mnt-obs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mnt-obs }
  template:
    metadata:
      labels: { app: mnt-obs }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: mnt-obs
          image: harbor.io:7443/mnt/mnt-obs:TAG
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: mnt-obs-config }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mnt-obs
  namespace: openkcloud-mnt
  labels: { app: mnt-obs }
spec:
  selector: { app: mnt-obs }
  ports:
    - name: http
      port: 80
      targetPort: 8000
# 게이트웨이(Istio VirtualService): prefix /api/obs → mnt-obs:80
