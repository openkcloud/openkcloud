# openKcloud 로그인 테마 — 포털 옛 /login 화면 모양(왼쪽 브랜드 영역 + 오른쪽 로그인 카드)
# base(마크업만, 스타일 없음)를 이어받고 스타일은 css/openkcloud.css 하나로 처리한다.
parent=base
locales=ko

styles=css/openkcloud.css
# 포털 주소 밑으로 열리면 주소창을 /auth/login/ 로(resources/js/okc-address.js)
scripts=js/okc-address.js
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=okc-html
kcBodyClass=okc-body
kcLoginClass=okc-page
kcHeaderClass=okc-sr-only
kcFormCardClass=okc-card
kcFormHeaderClass=okc-card-header

## 입력
kcFormGroupClass=okc-field
kcFormGroupErrorClass=okc-field-invalid
kcLabelClass=okc-label
kcLabelWrapperClass=okc-label-wrap
kcInputWrapperClass=okc-input-wrap
kcInputClass=okc-input
kcInputGroup=okc-input-group
kcInputErrorMessageClass=okc-field-error
kcInputHelperTextBeforeClass=okc-help
kcInputHelperTextAfterClass=okc-help
kcInputClassCheckbox=okc-check
kcInputClassCheckboxInput=okc-check-input
kcInputClassCheckboxLabel=okc-check-label
kcInputClassRadio=okc-check
kcInputClassRadioInput=okc-check-input
kcInputClassRadioLabel=okc-check-label
kcFormSettingClass=okc-options
kcFormOptionsClass=okc-options
kcFormOptionsWrapperClass=okc-options-right
kcFormButtonsClass=okc-buttons
kcFormButtonsWrapperClass=okc-buttons
kcContentWrapperClass=okc-content-row

## 비밀번호 보기 버튼(아이콘은 CSS 그림)
kcFormPasswordVisibilityButtonClass=okc-pw-toggle
kcFormPasswordVisibilityIconShow=okc-icon okc-icon-eye
kcFormPasswordVisibilityIconHide=okc-icon okc-icon-eye-off

## 버튼
kcButtonClass=okc-btn
kcButtonPrimaryClass=okc-btn-primary
kcButtonDefaultClass=okc-btn-secondary
kcButtonBlockClass=okc-btn-block
kcButtonLargeClass=okc-btn-lg

## 안내 상자
kcAlertClass=okc-alert
kcAlertTitleClass=okc-alert-text
kcFeedbackErrorIcon=okc-icon okc-icon-error
kcFeedbackWarningIcon=okc-icon okc-icon-warning
kcFeedbackSuccessIcon=okc-icon okc-icon-success
kcFeedbackInfoIcon=okc-icon okc-icon-info
kcResetFlowIcon=okc-icon okc-icon-restart

kcSignUpClass=okc-info
kcInfoAreaWrapperClass=okc-info-inner
