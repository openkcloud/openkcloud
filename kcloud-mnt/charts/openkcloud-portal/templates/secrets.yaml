{{- /* 앱 시크릿 — 차트가 만든다(2026-10-14, 배포를 git pull → build-push.sh → helm upgrade 만으로).
       릴리스와 함께 만들고 지운다(helm uninstall 하면 삭제 → 다시 설치하려면 값이 모두 values.yaml 에 있어야 한다).
       값 = values.yaml 의 secrets.* · workflow.dbPassword, 비어 있으면 클러스터에 이미 있는 값을 그대로 쓴다.
       mnt-core-secret 의 DATABASE_URL 은 CNPG 시크릿(포털 DB 계정 비밀번호)으로 만든다.
       값이 바뀌면 파드가 다시 시작된다(backends·workflow 의 checksum/secret). */ -}}
{{- $root := . -}}
{{- $ns := .Values.global.namespace -}}
{{- $s := .Values.secrets -}}
{{- $b := .Values.backends -}}
{{- $w := .Values.workflow -}}
{{- $old := dict -}}
{{- range $n := list $b.core.secretName $b.iaas.secretName $b.paas.secretName $b.obs.secretName $b.ainb.secretName $w.secretName }}
{{- $_ := set $old $n ((lookup "v1" "Secret" $ns $n).data | default dict) }}
{{- end }}
{{- $oc := index $old $b.core.secretName }}
{{- $oi := index $old $b.iaas.secretName }}
{{- $op := index $old $b.paas.secretName }}
{{- $oo := index $old $b.obs.secretName }}
{{- $ow := index $old $w.secretName }}

{{- /* 포털 DB 주소 — CNPG 시크릿의 비밀번호, 없으면 기존 값 */}}
{{- $pg := (lookup "v1" "Secret" $ns $s.db.appSecret).data | default dict }}
{{- $dbUrl := include "okc.secretValue" (list "" $oc "DATABASE_URL") }}
{{- if $pg.password }}
{{- $dbUrl = printf "postgresql+psycopg://%s:%s@%s/%s" $s.db.user ($pg.password | b64dec | urlquery) $s.db.host $s.db.name }}
{{- end }}
{{- $kcs := include "okc.secretValue" (list $s.keycloakClientSecret $oc "KEYCLOAK_CLIENT_SECRET") }}
{{- /* OpenStack 계정 — IAAS·PAAS 공통(기존 값은 iaas → paas 순) */}}
{{- $osUser := include "okc.secretValue" (list $s.openstack.username $oi "OS_USERNAME") | default (include "okc.secretValue" (list "" $op "OS_USERNAME")) }}
{{- $osPass := include "okc.secretValue" (list $s.openstack.password $oi "OS_PASSWORD") | default (include "okc.secretValue" (list "" $op "OS_PASSWORD")) }}
{{- $monUser := include "okc.secretValue" (list $s.monitor.username $oo "MONITOR_USERNAME") }}
{{- $monPass := include "okc.secretValue" (list $s.monitor.password $oo "MONITOR_PASSWORD") }}
{{- $tpw := include "okc.secretValue" (list $w.dbPassword $ow "POSTGRES_PWD") }}
{{- /* AI 노트북(MNT-AINB) — IDE 세션 키는 처음 설치 때 무작위로 만들고 그 뒤로는 기존 값 유지, MinIO 계정은 비우면 모듈 기본값 */}}
{{- $oa := index $old $b.ainb.secretName }}
{{- $ainbSession := include "okc.secretValue" (list $s.ainb.sessionSecret $oa "CMP_SESSION_SECRET") | default (randAlphaNum 64) }}
{{- $ainbStoreKey := include "okc.secretValue" (list $s.ainb.modelStoreKey $oa "MODEL_STORE_KEY") }}
{{- $ainbStoreSecret := include "okc.secretValue" (list $s.ainb.modelStoreSecret $oa "MODEL_STORE_SECRET") }}

{{- /* 빈 값이면 배포를 멈춘다 — 빈 시크릿으로 파드가 뜨지 않게. 클러스터에 붙은 배포에서만(helm template·lint 는 건너뜀) */}}
{{- if lookup "v1" "Namespace" "" $ns }}
{{- $need := dict (printf "DATABASE_URL(CNPG 시크릿 %s 확인)" $s.db.appSecret) $dbUrl "secrets.keycloakClientSecret" $kcs
      "secrets.openstack.username" $osUser "secrets.openstack.password" $osPass
      "secrets.monitor.username" $monUser "secrets.monitor.password" $monPass }}
{{- if $w.enabled }}{{- $_ := set $need "workflow.dbPassword" $tpw }}{{- end }}
{{- $missing := list }}
{{- range $k, $v := $need }}{{- if not $v }}{{- $missing = append $missing $k }}{{- end }}{{- end }}
{{- if $missing }}
{{- fail (printf "\n시크릿 값이 비어 있습니다 — charts/openkcloud-portal/values.yaml 에 적어 주세요: %s" (join ", " $missing)) }}
{{- end }}
{{- end }}
---
{{ include "okc.secret" (list $root $b.core.secretName (dict "DATABASE_URL" $dbUrl "KEYCLOAK_CLIENT_SECRET" $kcs)) }}
---
{{ include "okc.secret" (list $root $b.iaas.secretName (dict "OS_USERNAME" $osUser "OS_PASSWORD" $osPass)) }}
---
{{ include "okc.secret" (list $root $b.paas.secretName (dict "OS_USERNAME" $osUser "OS_PASSWORD" $osPass)) }}
---
{{ include "okc.secret" (list $root $b.obs.secretName (dict "MONITOR_USERNAME" $monUser "MONITOR_PASSWORD" $monPass)) }}
---
{{ include "okc.secret" (list $root $b.ainb.secretName (dict "CMP_SESSION_SECRET" $ainbSession "MODEL_STORE_KEY" $ainbStoreKey "MODEL_STORE_SECRET" $ainbStoreSecret)) }}
{{- if $w.enabled }}
---
{{ include "okc.secret" (list $root $w.secretName (dict "POSTGRES_PWD" $tpw "VISIBILITY_POSTGRES_PWD" $tpw)) }}
{{- end }}
