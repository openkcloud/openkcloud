# Test Deployment that runs the keti-cost-scheduler image with the default
# scheduler, for checking the image and RBAC before replacing a live scheduler.
# Apply after cost-based-scheduler.yaml (it creates the namespace and ServiceAccount).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-keti-cost-scheduler
  namespace: kcp-control-plane
  labels:
    app: test-keti-cost-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-keti-cost-scheduler
  template:
    metadata:
      labels:
        app: test-keti-cost-scheduler
    spec:
      schedulerName: default-scheduler
      serviceAccountName: keti-cost-scheduler
      terminationGracePeriodSeconds: 30
      containers:
      - name: test-keti-cost-scheduler
        image: ketidevit2/keti-cost-scheduler:0.4.2
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 500Mi
